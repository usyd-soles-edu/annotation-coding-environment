[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ace-coder"
dynamic = ["version"]
description = "Lightweight qualitative coding tool with inter-coder reliability"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "jinja2-fragments>=1.5",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "pysbd>=0.3.4",
]

[project.scripts]
ace = "ace.__main__:main"

[tool.hatch.version]
path = "src/ace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: deliberate process/wait lifecycle tests that are slow without a browser (launcher lifecycle family). Excluded from the fast tier; the fast loop is `uv run pytest -m 'not slow'`.",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "nuitka[onefile]>=4.0.7",
    "pytest>=9.0.2",
]
